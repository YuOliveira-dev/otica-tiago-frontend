<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>TS EYEWEAR — Manual do Usuário com Vídeos Reais</title>
  <style>
    :root {
      --gold: #c5a96f;
      --gold-dark: #a18349;
      --gold-light: #f5ecd8;
      --bg-dark: #0b0f17;
      --bg-card: #131928;
      --bg-card-hover: #1a2236;
      --border: #1e293b;
      --border-gold: rgba(197, 169, 111, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(11, 15, 23, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
    }
    .brand-badge {
      background: rgba(197, 169, 111, 0.15);
      border: 1px solid var(--border-gold);
      color: var(--gold);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .main-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }
    @media (max-width: 960px) {
      .main-layout { grid-template-columns: 1fr; }
    }
    .sidebar {
      background: #0e1420;
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      overflow-y: auto;
    }
    .sidebar-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      padding-left: 8px;
    }
    .module-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 8px;
      border: 1px solid transparent;
      text-decoration: none;
      color: inherit;
    }
    .module-item:hover {
      background: var(--bg-card);
      border-color: var(--border);
    }
    .module-item.active {
      background: var(--bg-card);
      border-color: var(--gold);
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .module-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(197, 169, 111, 0.12);
      border: 1px solid var(--border-gold);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }
    .module-item.active .module-num {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }
    .module-info { flex: 1; min-width: 0; }
    .module-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .module-sub {
      font-size: 12px;
      color: var(--text-muted);
    }
    .content-area {
      padding: 32px;
      overflow-y: auto;
    }
    @media (max-width: 600px) {
      .content-area { padding: 16px; }
    }
    .module-header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header-title-box h1 {
      font-size: 26px;
      color: #fff;
      margin-bottom: 6px;
    }
    .header-title-box p {
      font-size: 14px;
      color: var(--text-muted);
    }
    .actions-box {
      display: flex;
      gap: 10px;
    }
    .btn-pdf {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(197, 169, 111, 0.15);
      color: var(--gold);
      border: 1px solid var(--border-gold);
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-pdf:hover {
      background: var(--gold);
      color: #000;
    }
    .video-card {
      background: #000;
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .video-player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }
    .video-player-container video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      outline: none;
    }
    .video-toolbar {
      background: #111827;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }
    .video-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
    }
    .qr-badge-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .qr-thumb {
      width: 44px;
      height: 44px;
      background: #fff;
      padding: 2px;
      border-radius: 4px;
      cursor: pointer;
    }
    .steps-section {
      margin-top: 32px;
    }
    .steps-title {
      font-size: 18px;
      color: #fff;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .steps-grid {
      display: grid;
      gap: 18px;
    }
    .step-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      display: grid;
      grid-template-columns: 50px 1fr auto;
      gap: 18px;
      align-items: center;
      transition: all 0.2s;
    }
    @media (max-width: 700px) {
      .step-card { grid-template-columns: 40px 1fr; }
      .step-img-link { grid-column: 1 / -1; }
    }
    .step-card:hover {
      border-color: var(--border-gold);
      background: var(--bg-card-hover);
    }
    .step-badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--gold);
      color: #0b0f17;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
    }
    .step-info h3 {
      font-size: 16px;
      color: #fff;
      margin-bottom: 4px;
    }
    .step-info p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .step-img-link {
      display: block;
      width: 140px;
      height: 85px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
    }
    .step-img-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .step-img-link:hover img {
      transform: scale(1.05);
    }
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 95%;
      max-height: 90vh;
      border-radius: 8px;
      border: 2px solid var(--gold);
    }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 20px;
      color: #fff; font-size: 32px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-logo">TS EYEWEAR</div>
      <div class="brand-badge">Manual Operacional com Vídeos Reais</div>
    </div>
    <div>
      <span style="font-size: 12px; color: var(--text-muted);">Velocidade Calma e Didática • Produção</span>
    </div>
  </header>

  <div class="main-layout">
    <aside class="sidebar">
      <div class="sidebar-title">Módulos do Sistema (7)</div>
      <div id="moduleNav"></div>
    </aside>

    <main class="content-area">
      <div class="module-header">
        <div class="header-title-box">
          <h1 id="modTitle">Carregando...</h1>
          <p id="modSubtitle"></p>
        </div>
        <div class="actions-box">
          <a id="btnPdfDownload" href="#" target="_blank" class="btn-pdf">
            📄 Baixar Manual em PDF
          </a>
        </div>
      </div>

      <div class="video-card">
        <div class="video-player-container">
          <video id="videoPlayer" controls playsinline preload="metadata">
            <source id="videoSource" src="" type="video/mp4">
            Seu navegador não suporta a tag de vídeo.
          </video>
        </div>
        <div class="video-toolbar">
          <div class="video-badge">
            ▶ Vídeo Real em Alta Definição • Reprodução Web e Celular
          </div>
          <div class="qr-badge-box">
            <span style="font-size: 12px; color: var(--text-muted);">Escanear no celular:</span>
            <img id="qrImg" class="qr-thumb" src="" alt="QR Code" onclick="openLightbox(this.src)">
          </div>
        </div>
      </div>

      <div class="steps-section">
        <div class="steps-title">
          <span>Passo a Passo com Dados Reais</span>
        </div>
        <div class="steps-grid" id="stepsList"></div>
      </div>
    </main>
  </div>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" src="" alt="Ampliação">
  </div>

  <script>
    const modules = [{"id":"01","folder":"01-Login","videoFile":"video-01-login.mp4","pdfFile":"Manual-01-Login.pdf","title":"Módulo 01: Login no Painel","subtitle":"Autenticação e Acesso Seguro ao Sistema","duration":"0:33","steps":[{"num":1,"title":"Acessar a URL do Painel","desc":"Acesse https://tsjoculos.com/admin no seu navegador preferido.","img":"01-tela-login.png"},{"num":2,"title":"Digitar o E-mail de Acesso","desc":"Digite seu e-mail institucional autorizado: admin@tseyewear.com.br.","img":"02-preenchendo-email.png"},{"num":3,"title":"Digitar Senha de Segurança","desc":"Insira sua senha segura. Use o ícone de olho para checar os caracteres.","img":"03-preenchendo-senha.png"},{"num":4,"title":"Confirmar no Botão Dourado","desc":"Clique em \"Entrar no Painel\" para validação das credenciais e redirecionamento.","img":"04-login-sucesso-redirecionamento.png"},{"num":5,"title":"Menu Lateral (Sidebar)","desc":"Conheça os atalhos para Dashboard, Produtos, Novo Produto, Categorias e Banners.","img":"05-sidebar-navegacao.png"}]},{"id":"02","folder":"02-Dashboard","videoFile":"video-02-dashboard.mp4","pdfFile":"Manual-02-Dashboard.pdf","title":"Módulo 02: Dashboard Executivo","subtitle":"Visão Geral, Indicadores de Estoque e Atalhos Rápidos","duration":"0:22","steps":[{"num":1,"title":"Visão Geral do Painel Executivo","desc":"Central de comando com indicadores consolidados do catálogo em tempo real.","img":"01-dashboard-visao-geral.png"},{"num":2,"title":"Cartões de Métricas (KPIs)","desc":"Acompanhe Total de Modelos, Ativos, Ocultos e Alertas de Atenção ao Estoque.","img":"02-dashboard-metricas.png"},{"num":3,"title":"Atalhos Rápidos e Modelos Recentes","desc":"Use botões de ação imediata e visualize a lista de armações recentes.","img":"03-dashboard-completo.png"}]},{"id":"03","folder":"03-Produtos","videoFile":"video-03-produtos.mp4","pdfFile":"Manual-03-Produtos.pdf","title":"Módulo 03: Catálogo de Produtos","subtitle":"Gestão de Armações, Busca Rápida e Controle de Visibilidade","duration":"0:22","steps":[{"num":1,"title":"Catálogo Geral de Armações","desc":"Visualização completa das armações cadastradas com fotos de capa e preços.","img":"01-lista-produtos.png"},{"num":2,"title":"Busca Instantânea por Modelo Real","desc":"Digite \"Milano\" ou código SKU para filtrar os modelos instantaneamente na tabela.","img":"02-tabela-produtos.png"},{"num":3,"title":"Toggle de Visibilidade e Edição","desc":"Alterne o status de visibilidade em 1 clique ou abra a armação para editar.","img":"03-produtos-completo.png"}]},{"id":"04","folder":"04-Novo-Produto","videoFile":"video-04-novo-produto.mp4","pdfFile":"Manual-04-Novo-Produto.pdf","title":"Módulo 04: Cadastro Real de Produto","subtitle":"Exemplo Real: Armação Acetato TS Florence Gold (TS-9020)","duration":"0:44","steps":[{"num":1,"title":"Formulário Modular de Produto","desc":"Estrutura dividida em blocos lógicos para especificações ópticas.","img":"01-formulario-novo-produto.png"},{"num":2,"title":"Título, SKU e Descrição","desc":"Título: \"Armação Acetato TS Florence Gold\", SKU: \"TS-9020\" e descrição técnica.","img":"02-informacoes-gerais.png"},{"num":3,"title":"Preços De / Por e Selos","desc":"Preço De: R$ 489,00 | Preço Por: R$ 349,00 com selos Destaque e Lançamento.","img":"03-secao-precos.png"},{"num":4,"title":"Galeria de Fotos e Mídias","desc":"Upload de imagens nítidas. A 1ª foto é capa e a 2ª ativa o efeito hover.","img":"04-secao-midias.png"},{"num":5,"title":"Cores e Medidas Ópticas Reais","desc":"Cor: Tartaruga Havana | Medidas: Aro 53mm, Ponte 18mm, Haste 142mm.","img":"05-secao-variacoes.png"},{"num":6,"title":"Status Ativo e Botão Salvar","desc":"Marque a armação como \"Ativo\" e clique no botão dourado \"Salvar Produto\".","img":"06-secao-estoque-visibilidade.png"},{"num":7,"title":"Armação Publicada com Sucesso","desc":"Validação concluída! O produto entra imediatamente no catálogo online.","img":"07-formulario-completo.png"}]},{"id":"05","folder":"05-Destaques","videoFile":"video-05-destaques.mp4","pdfFile":"Manual-05-Destaques.pdf","title":"Módulo 05: Mais Desejados","subtitle":"Curadoria da Vitrine Principal da Home e Selos de Novidade","duration":"0:16","steps":[{"num":1,"title":"Vitrine Mais Desejados da Home","desc":"Espaço de destaque no topo da página inicial com modelos mais vendidos.","img":"01-destaques-visao-geral.png"},{"num":2,"title":"Selecionar Modelo e Ativar Lançamento","desc":"Escolha a armação no seletor, marque a etiqueta \"Lançamento\" e adicione.","img":"02-destaques-completo.png"}]},{"id":"06","folder":"06-Categorias","videoFile":"video-06-categorias.mp4","pdfFile":"Manual-06-Categorias.pdf","title":"Módulo 06: Gestão de Categorias","subtitle":"Estruturação do Menu da Loja, Subcategorias e URLs Amigáveis","duration":"0:16","steps":[{"num":1,"title":"Taxonomia e Estrutura de Menus","desc":"Organização do catálogo em dois níveis: Categorias Mestras e Subcategorias.","img":"01-categorias-visao-geral.png"},{"num":2,"title":"Criar Nova Categoria Principal","desc":"Clique em \"+ Nova Categoria\", defina nome, ordem de exibição e links amigáveis.","img":"02-categorias-completo.png"}]},{"id":"07","folder":"07-Banners","videoFile":"video-07-banners.mp4","pdfFile":"Manual-07-Banners.pdf","title":"Módulo 07: Banners Promocionais","subtitle":"Slides Hero do Topo e Cards Fotográficos de Categorias","duration":"0:22","steps":[{"num":1,"title":"Carrossel Hero e Cards Visuais","desc":"Gestão dos grandes slides de topo e dos cartões fotográficos por categoria.","img":"01-banners-visao-geral.png"},{"num":2,"title":"Criar Novo Banner Promocional","desc":"Insira imagem panorâmica 1920x600px, textos chamativos e link do botão CTA.","img":"02-banners-lista.png"},{"num":3,"title":"Cards Fotográficos de Categorias","desc":"Defina fotos elegantes para guiar os clientes às coleções principais da loja.","img":"03-banners-completo.png"}]}];
    let currentIdx = 0;

    function renderNav() {
      const nav = document.getElementById('moduleNav');
      nav.innerHTML = modules.map((m, idx) => `
        <div class="module-item ${idx === currentIdx ? 'active' : ''}" onclick="selectModule(${idx})">
          <div class="module-num">${m.id}</div>
          <div class="module-info">
            <div class="module-name">${m.title}</div>
            <div class="module-sub">${m.steps.length} passos • ${m.duration}</div>
          </div>
        </div>
      `).join('');
    }

    function selectModule(idx) {
      currentIdx = idx;
      renderNav();
      const m = modules[idx];
      const slug = m.slug || m.folder.toLowerCase();

      document.getElementById('modTitle').textContent = m.title;
      document.getElementById('modSubtitle').textContent = m.subtitle;
      document.getElementById('btnPdfDownload').href = `/manual/${slug}/${m.pdfFile}`;
      document.getElementById('btnPdfDownload').setAttribute('download', m.pdfFile);

      const player = document.getElementById('videoPlayer');
      const src = document.getElementById('videoSource');
      src.src = `/manual/${slug}/${m.videoFile}`;
      player.load();

      const qr = document.getElementById('qrImg');
      qr.src = `/manual/${slug}/qr-video.png`;

      const stepsList = document.getElementById('stepsList');
      stepsList.innerHTML = m.steps.map(s => `
        <div class="step-card">
          <div class="step-badge">${s.num}</div>
          <div class="step-info">
            <h3>${s.title}</h3>
            <p>${s.desc}</p>
          </div>
          <div class="step-img-link" onclick="openLightbox('/manual/${slug}/${s.img}')">
            <img src="/manual/${slug}/${s.img}" alt="${s.title}">
          </div>
        </div>
      `).join('');

      window.location.hash = slug;
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    const hash = window.location.hash.replace('#', '').toLowerCase();
    const foundIdx = modules.findIndex(m => m.folder.toLowerCase() === hash || (m.slug && m.slug.toLowerCase() === hash));
    if (foundIdx >= 0) currentIdx = foundIdx;

    renderNav();
    selectModule(currentIdx);
  </script>
</body>
</html>
