<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>TS EYEWEAR — Módulo 04: Cadastro Real de Produto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f17;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 980px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
    }
    .logo-group { display: flex; align-items: center; gap: 10px; }
    .brand-logo { color: #c5a96f; font-weight: 800; letter-spacing: 2px; font-size: 20px; }
    .badge {
      background: rgba(197, 169, 111, 0.15);
      border: 1px solid rgba(197, 169, 111, 0.4);
      color: #c5a96f;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .video-card {
      position: relative;
      padding-top: 56.25%;
      background: #000;
      border: 1px solid rgba(197, 169, 111, 0.4);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #c5a96f;
      color: #0b0f17;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .qr-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #131928;
      border: 1px solid #1e293b;
      padding: 10px 16px;
      border-radius: 8px;
    }
    .qr-img { width: 44px; height: 44px; background: #fff; padding: 2px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-group">
        <span class="brand-logo">TS EYEWEAR</span>
        <span class="badge">MANUAL ONLINE</span>
      </div>
      <a href="../" class="btn btn-secondary">← Ver Todos os Módulos</a>
    </header>

    <h1 style="font-size: 24px; margin-bottom: 6px;">Módulo 04: Cadastro Real de Produto</h1>
    <p style="color: #94a3b8; font-size: 14px; margin-bottom: 18px;">
      Demonstração prática gravada em alta definição com exemplos reais do sistema.
    </p>

    <div class="video-card">
      <video controls autoplay playsinline style="position:absolute;top:0;left:0;width:100%;height:100%;"><source src="video-04-novo-produto.mp4" type="video/mp4"></video>
    </div>

    <div class="actions">
      <a href="Manual-04-Novo-Produto.pdf" target="_blank" class="btn">
        📄 Baixar Manual em PDF
      </a>
      <div class="qr-box">
        <img class="qr-img" src="qr-video.png" alt="QR Code">
        <div>
          <div style="font-size: 12px; font-weight: 600; color: #c5a96f;">Assistir no Celular</div>
          <div style="font-size: 11px; color: #94a3b8;">Aponte a câmera para abrir</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
